#
# Wheels of OGR FEM2D (spec 001, RF-9, task T14; ADR-0001, criterion 3): one
# abi3 wheel per platform (Python >= 3.11), built with maturin-action on
# Windows, macOS ARM and Linux; each wheel is then installed and the whole
# test suite, the validation cases included, runs on its compiled module with
# Python 3.11, 3.12 and 3.13; and the program of the validation cases is
# frozen with PyInstaller and solves them on each platform.

name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: ""
          - os: macos-15          # Apple silicon
            target: aarch64
            manylinux: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install system libraries for Qt
        # spec 006, part C: the interface's tests build real widgets, off
        # screen; PySide6 needs these on Linux even so (the list of OGR
        # Slip2D's and OGR-GUI's CI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0
      - name: Install the wheel (with its dependencies, ogr-core and ogr-gui at their tags)
        # with the extra [mcp]: the tests of the MCP server need the SDK
        # (spec 006, T16; without it they say they cannot run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(ls dist/*.whl)[mcp]"
      - name: The installed package works outside the tree
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/.github/scripts/wheel_check.py" installed
      - name: Put the compiled module of the wheel in the tree
        run: python .github/scripts/wheel_check.py extract dist/*.whl
      - name: Test suite, validation cases included, on the wheel's binary
        # off screen on every platform: the interface's tests never reach a
        # display
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: python tests/_runner.py

  freeze:
    # spec 001, RF-10, task T15: the program of the validation cases, frozen
    # with PyInstaller on each platform, solves both cases outside the tree.
    # spec 006, T36: and the program with its interface, which opens, meshes,
    # calculates and queries case 007 through its window, off screen
    name: freeze (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install system libraries for Qt
        # spec 006, T36: the frozen interface runs its self-test off
        # screen; PySide6 needs these on Linux even so (as for the tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxcb-xinerama0 libxcb-cursor0
      - name: Install the wheel, and PyInstaller as a tool (spec 001, D6)
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl "pyinstaller==6.22.3"
      - name: Put the compiled module of the wheel in the tree
        run: python .github/scripts/wheel_check.py extract dist/*.whl
      - name: Freeze both programs and run them outside the tree
        run: python poc/freeze/build.py
